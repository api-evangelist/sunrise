description: Sunrise Robotics builds intelligent, two-armed autonomous robotic cells for manufacturing.
  The AI-driven system combines built-in perception and environmental awareness with autonomous execution
  to transform existing production processes, increase capacity, and free human workers for higher-value
  tasks. Cells deploy quickly (needing only a three-phase outlet), are flexible across manufacturing
  applications, and are built to ISO 10218 / TS 15066 safety standards. The company is backed by Seedcamp
  and Slow Ventures.
